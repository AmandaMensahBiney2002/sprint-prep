<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main>

        <h1>My Todo List</h1>


        <input 
            type="text" 
            id="taskInput" 
            placeholder="Enter a task">


        <button id="addButton">
            Add Task
        </button>


        <p>
            Remaining Tasks:
            <span id="taskCount">0</span>
        </p>


        <ul id="taskList"></ul>


    </main>


    <script src="script.js"></script>

</body>

</html>
